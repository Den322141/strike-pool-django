{{ form.non_field_errors }}
{% for field in form %}
<div class="field">
  {% if field.name == 'zones' %}<fieldset><legend>{{ field.label }}</legend>{{ field }}</fieldset>
  {% else %}{{ field.label_tag }}{{ field }}{% endif %}
  {% if field.help_text %}<div class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
