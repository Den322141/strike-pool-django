{% if page.has_other_pages %}<nav class="chips" aria-label="Страницы">{% if page.has_previous %}<a class="btn btn-secondary" href="{% querystring page=page.previous_page_number %}">Назад</a>{% endif %}<span>{{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn btn-secondary" href="{% querystring page=page.next_page_number %}">Дальше</a>{% endif %}</nav>{% endif %}
